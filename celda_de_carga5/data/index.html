<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTERO-HX711</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>UTERO-HX711</h1>
      <p>AP UTERO-HX711 - 192.168.4.1</p>
    </div>
    <div id="estado" class="status warn">Conectando</div>
  </header>

  <main class="layout">
    <section class="panel display-panel">
      <div class="panel-head">
        <h2>Pantalla</h2>
        <span id="alarmBadge" class="badge">Normal</span>
      </div>

      <div class="lcd" aria-label="LCD virtual">
        <div id="lcd0">Iniciando...</div>
        <div id="lcd1"></div>
      </div>

      <div class="readings">
        <div>
          <span>Now</span>
          <strong><span id="now">--</span> g</strong>
        </div>
        <div>
          <span>Last</span>
          <strong><span id="last">--</span> g</strong>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Estado</h2>
        <span id="zoneBadge" class="badge zone-blue">Azul</span>
      </div>

      <div id="zoneLight" class="zone-light zone-blue"></div>

      <dl class="state-list">
        <div>
          <dt>Zona</dt>
          <dd id="zona">--</dd>
        </div>
        <div>
          <dt>Humedad</dt>
          <dd id="humedad">--</dd>
        </div>
        <div>
          <dt>Alarma</dt>
          <dd id="alarma">--</dd>
        </div>
      </dl>

      <button id="btnTare" class="primary-btn" type="button">TARA</button>
    </section>

    <section class="panel motor-panel">
      <div class="panel-head">
        <h2>Pot virtual</h2>
        <span id="motorDir" class="badge">Centro</span>
      </div>

      <div class="motor-buttons">
        <button id="btnLeft" class="icon-btn" type="button" title="Mover izquierda" aria-label="Mover izquierda">&larr;</button>
        <button id="btnStop" class="icon-btn stop" type="button" title="Detener" aria-label="Detener">&#9632;</button>
        <button id="btnRight" class="icon-btn" type="button" title="Mover derecha" aria-label="Mover derecha">&rarr;</button>
      </div>

      <label class="range-wrap" for="motorRange">
        <span>Izquierda</span>
        <input id="motorRange" type="range" min="-100" max="100" value="0" step="1">
        <span>Derecha</span>
      </label>

      <div class="motor-track">
        <div id="motorMarker" class="motor-marker"></div>
      </div>

      <dl class="state-list compact">
        <div>
          <dt>Posicion</dt>
          <dd id="motorPos">0</dd>
        </div>
        <div>
          <dt>Limites</dt>
          <dd id="motorLimits">--</dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
